[project]
name = "snapchat-auto-selection"
version = "1.0.0"
description = "Read, write and build Snapchat Auto selection files — which rows a partial report should contain."
readme = "README.md"
requires-python = ">=3.10"
# Empty, and it stays empty. This distribution exists so another tool can produce a selection without
# taking on Snapchat Auto's dependencies (pandas, OpenCV, a GUI toolkit, a build backend). An
# import-hygiene test walks its ASTs and fails on anything outside the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/dfjs1m/Snapchat_Auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapchat_auto_selection"]
