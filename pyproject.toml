[project]
    name = "Snapchat_Auto"
    version = "1.6.0-beta.5+build.20260831"
    description = "Add your description here"
    readme = "README.md"
    requires-python = ">=3.14,<3.15"
    dependencies = [
        "blackboxprotobuf",
        "filetype",
        "opencv-python",
        "pandas",
        "pillow",
        "pyasn1",
        "pycryptodome",
        "requests",
        "freesimplegui",
        "nuitka",
        "dfjsim_shared_tools",
        # The selection file format, in its own dependency-free distribution so an external tool can
        # produce a selection without taking on anything above. The application imports the same
        # module (scripts/selection_file.py re-exports it) so there is one implementation.
        "snapchat-auto-selection",
    ]


    [project.optional-dependencies]
        # Any one of these provides an in-process SQLCipher binding for decrypting
        # gallery.encrypteddb (old storage schema). Install whichever has wheels for your
        # platform; scripts/memories_media_report.py picks up any of them, and falls back
        # to scripts/data/sqlcipher3.exe when none is present.
        sqlcipher3 = [
            "sqlcipher3",
        ]
        sqlcipher3-binary = [
            "sqlcipher3-binary",
        ]
        sqlcipher3-wheels = [
            "sqlcipher3-wheels",
        ]

    [project.scripts]
        build = "dfjsim_shared_tools.build_nuitka_wix_installer:main"

[tool.uv]
    package = true

    # A path inside this repository, unlike the local editable path this replaced: a fresh clone
    # resolves it, which is what makes the build reproducible for anyone.
    [tool.uv.workspace]
        members = ["packages/*"]

    [tool.uv.sources]
        snapchat-auto-selection = { workspace = true }
        nuitka = { url = "https://github.com/Nuitka/Nuitka/archive/main.zip" }
        # Pinned to a tag, not a branch: a build has to be reproducible, and this repository is
        # public so anyone cloning it can resolve the dependency. It replaces a local editable path
        # that only existed on one machine.
        dfjsim_shared_tools = { git = "https://github.com/dfjsim/dfjsim_shared_tools.git", tag = "v0.3.0" }

[tool.setuptools.packages.find]
    where   = ["."]
    include = ["scripts*"]

[tool.msi]
    upgrade_code = "E873CA5B-EB6F-4A47-9038-118D37FC1950"

    # The MSI ProductVersion, which must be numeric-only — so a pre-release `[project].version`
    # cannot be derived from and has to be given here. The two are different strings on purpose:
    # `[project].version` is what the reports, the saved selections and the update check use (and it
    # has to carry the pre-release marker, because that is what makes 1.6.0-beta.1 sort below 1.6.0),
    # while Windows Installer only understands major.minor.build[.revision].
    #
    # The date lives in the fourth field, which Windows Installer **ignores** when comparing versions.
    # That is safe here only because the bundled WiX template sets AllowSameVersionUpgrades="yes":
    # without it, a second beta sharing these first three fields would not be seen as an upgrade.
    version = "1.6.0.20260831"

[tool.wix-build]
    # Copied next to the built executable and into the MSI. pyproject.toml is how the installed
    # app knows its own version — including the "+build.N" tag the update check compares against
    # (docs/auto_update.md); scripts/ carries the data files Nuitka leaves out of a standalone
    # build, notably scripts/data/sqlcipher3.exe.
    copy_files = ["pyproject.toml", "scripts"]

[tool.wix-nuitka]
    # "force" is Nuitka's default and what build_nuitka.cmd's portable EXE gets, so the installed
    # app behaves the same: --diag-keychain and headless --zip runs print where someone can read
    # them, and a GUI run can still pause at the end. "disable" builds a windowed binary with no
    # console at all, which silently discards all of that.
    windows_console_mode = "force"
    entry_point          = "Snapchat_Auto.py"
    plugins              = ["tk-inter"]
